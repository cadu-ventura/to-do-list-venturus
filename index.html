<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>To Do List</title>
  <link rel="icon" href="assets/img/logo-simbolo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="caixa">
    <img src="assets/img/logo-venturus.svg" alt="Venturus" class="logo">
    <h1>Minhas tarefas</h1>

    <input type="text" id="campo" placeholder="O que precisa ser feito?">
    <button id="botao">Adicionar</button>

    <div class="quadro">
      <div class="coluna">
        <h2>Pendentes <span id="total-pendentes">0</span></h2>
        <ul id="pendentes" class="lista"></ul>
      </div>

      <div class="coluna">
        <h2>Concluídas <span id="total-concluidas">0</span></h2>
        <ul id="concluidas" class="lista"></ul>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
